<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LESESPUREN – Adventkalender 2026</title>
<style>
:root{--night:#142a3e;--gold:#d7b474;--cream:#f8f1e5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#294761,var(--night) 75%);color:var(--cream);font-family:Georgia,serif;min-height:100vh}header{background:var(--cream);color:var(--night);padding:18px max(24px,calc((100vw - 1120px)/2));font-size:1.65rem;font-weight:bold}main{max-width:1120px;margin:auto;padding:42px 20px 70px;text-align:center}h1{font-size:clamp(2rem,5vw,3.7rem);font-weight:normal;margin:0 0 10px}p.intro{font-size:clamp(1rem,2vw,1.35rem);margin:0 0 35px}.calendar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px}.door{aspect-ratio:4/3;border:2px solid var(--gold);border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(145deg,#36546a,#1b3043);color:var(--cream);font:normal 2.6rem Georgia,serif;display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s}.door:not(:disabled){cursor:pointer}.door:not(:disabled):hover,.door:not(:disabled):focus-visible{transform:translateY(-3px);box-shadow:0 0 0 3px #fff4}.door:disabled{opacity:.72;cursor:not-allowed}.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.door .number{position:relative;z-index:1;text-shadow:0 2px 10px #000;background:#10223366;padding:0 9px;border-radius:6px}.door .lock{position:absolute;right:9px;top:8px;font:15px system-ui;opacity:.85}.note{margin-top:26px;color:#eadcc7;font:0.9rem system-ui,sans-serif}dialog{width:min(560px,calc(100% - 24px));border:1px solid var(--gold);border-radius:12px;background:var(--cream);color:var(--night);padding:20px;text-align:left}dialog::backdrop{background:#06131cbb}dialog img{width:100%;max-height:min(65vh,680px);object-fit:contain;background:#ddd}details{margin:20px 0;border-top:1px solid #d8c8aa;border-bottom:1px solid #d8c8aa;padding:13px 0}summary{cursor:pointer;font-weight:bold;font-size:1.08rem}#scriptureText{line-height:1.65;font-size:1.04rem}#scriptureText p{margin:.7rem 0}#scriptureText sup{font-size:.7rem;color:#667}dialog .scripture-source{font:0.8rem system-ui;color:#53616d}dialog .scripture-source a{background:none;color:#203e58;padding:0;text-decoration:underline}dialog{max-height:92vh;overflow:auto;width:min(720px,calc(100% - 24px))}dialog h2{font-size:1.5rem}dialog a{display:inline-block;background:var(--night);color:white;padding:12px 17px;border-radius:6px;text-decoration:none}dialog .close{float:right;border:0;background:transparent;font-size:1.7rem;cursor:pointer}#credit{font-size:.82rem;color:#4d5660}@media(max-width:850px){.calendar{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.calendar{grid-template-columns:repeat(3,1fr);gap:8px}.door{font-size:2rem}}
</style>

<body><header>lesespuren.at</header><main><h1>Der LESESPUREN-Adventkalender</h1><p class="intro">24 Bilder und Bibelstellen auf dem Weg nach Weihnachten.</p><div class="calendar" id="calendar" aria-label="Adventkalender mit 24 Türchen"></div><p class="note">Ab dem 1. Dezember öffnet sich täglich ein Türchen – mit Bild und aufklappbarem Bibeltext (Luther 1912).</p></main>
<dialog id="artDialog" aria-labelledby="artTitle"><button class="close" id="closeDialog" aria-label="Schließen">×</button><img id="artImage" alt=""><h2 id="artTitle"></h2><p id="credit"></p><details id="scripture"><summary>Bibeltext aufklappen</summary><div id="scriptureText"></div><p class="scripture-source">Lutherbibel 1912 · gemeinfrei · <a id="sourceLink" href="https://ebible.org/deu1912/" target="_blank" rel="noopener">Textquelle</a></p></details><p><a id="articleLink" href="https://www.lesespuren.at/" target="_blank" rel="noopener">Zu LESESPUREN →</a></p></dialog>
<script>
const entries=[{"day":1,"title":"Die Verkündigung","image":"bilder/01.webp","reference":"Lukas 1,26–28","verses":[{"number":26,"text":"Und im sechsten Monat ward der Engel Gabriel gesandt von Gott in eine Stadt in Galiläa, die heißt Nazareth,"},{"number":27,"text":"zu einer Jungfrau, die vertraut war einem Manne mit Namen Joseph, vom Hause David: und die Jungfrau hieß Maria."},{"number":28,"text":"Und der Engel kam zu ihr hinein und sprach: Gegrüßet seist du, Holdselige! Der HERR ist mit dir, du Gebenedeite unter den Weibern!"}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":2,"title":"Fürchte dich nicht","image":"bilder/02.webp","reference":"Lukas 1,29–30","verses":[{"number":29,"text":"Da sie aber ihn sah, erschrak sie über seine Rede und gedachte: Welch ein Gruß ist das?"},{"number":30,"text":"Und der Engel sprach zu ihr: Fürchte dich nicht, Maria! du hast Gnade bei Gott gefunden."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":3,"title":"Die Verheißung","image":"bilder/03.webp","reference":"Lukas 1,31–33","verses":[{"number":31,"text":"Siehe, du wirst schwanger werden und einen Sohn gebären, des Namen sollst du Jesus heißen."},{"number":32,"text":"Der wird groß sein und ein Sohn des Höchsten genannt werden; und Gott der HERR wird ihm den Stuhl seines Vaters David geben;"},{"number":33,"text":"und er wird ein König sein über das Haus Jakob ewiglich, und seines Königreiches wird kein Ende sein."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":4,"title":"Marias Frage","image":"bilder/04.webp","reference":"Lukas 1,34–37","verses":[{"number":34,"text":"Da sprach Maria zu dem Engel: Wie soll das zugehen, da ich von keinem Manne weiß?"},{"number":35,"text":"Der Engel antwortete und sprach zu ihr: Der heilige Geist wird über dich kommen, und die Kraft des Höchsten wird dich überschatten; darum wird auch das Heilige, das von dir geboren wird, Gottes Sohn genannt werden."},{"number":36,"text":"Und siehe, Elisabeth, deine Gefreunde, ist auch schwanger mit einem Sohn in ihrem Alter und geht jetzt im sechsten Monat, von der man sagt, daß sie unfruchtbar sei."},{"number":37,"text":"Denn bei Gott ist kein Ding unmöglich."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":5,"title":"Marias Zustimmung","image":"bilder/05.webp","reference":"Lukas 1,38","verses":[{"number":38,"text":"Maria aber sprach: Siehe ich bin des HERRN Magd; mir geschehe, wie du gesagt hast. Und der Engel schied von ihr."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":6,"title":"Marias Weg","image":"bilder/06.webp","reference":"Lukas 1,39–40","verses":[{"number":39,"text":"Maria aber stand auf in den Tagen und ging auf das Gebirge eilends zu der Stadt Juda's"},{"number":40,"text":"und kam in das Haus des Zacharias und grüßte Elisabeth."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":7,"title":"Die Begegnung mit Elisabeth","image":"bilder/07.webp","reference":"Lukas 1,41–45","verses":[{"number":41,"text":"Und es begab sich, als Elisabeth den Gruß Marias hörte, hüpfte das Kind in ihrem Leibe. Und Elisabeth ward des heiligen Geistes voll"},{"number":42,"text":"und rief laut und sprach: Gebenedeit bist du unter den Weibern, und gebenedeit ist die Frucht deines Leibes!"},{"number":43,"text":"Und woher kommt mir das, daß die Mutter meines HERRN zu mir kommt?"},{"number":44,"text":"Siehe, da ich die Stimme deines Grußes hörte, hüpfte mit Freuden das Kind in meinem Leibe."},{"number":45,"text":"Und o selig bist du, die du geglaubt hast! denn es wird vollendet werden, was dir gesagt ist von dem HERRN."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":8,"title":"Marias Lobgesang","image":"bilder/08.webp","reference":"Lukas 1,46–55","verses":[{"number":46,"text":"Und Maria sprach: Meine Seele erhebt den HERRN,"},{"number":47,"text":"und mein Geist freuet sich Gottes, meines Heilands;"},{"number":48,"text":"denn er hat die Niedrigkeit seiner Magd angesehen. Siehe, von nun an werden mich selig preisen alle Kindeskinder;"},{"number":49,"text":"denn er hat große Dinge an mir getan, der da mächtig ist und des Name heilig ist."},{"number":50,"text":"Und seine Barmherzigkeit währet immer für und für bei denen, die ihn fürchten."},{"number":51,"text":"Er übet Gewalt mit seinem Arm und zerstreut, die hoffärtig sind in ihres Herzens Sinn."},{"number":52,"text":"Er stößt die Gewaltigen vom Stuhl und erhebt die Niedrigen."},{"number":53,"text":"Die Hungrigen füllt er mit Gütern und läßt die Reichen leer."},{"number":54,"text":"Er denkt der Barmherzigkeit und hilft seinem Diener Israel wieder auf,"},{"number":55,"text":"wie er geredet hat unsern Vätern, Abraham und seinem Samen ewiglich."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":9,"title":"Marias Lobgesang im Abendlicht","image":"bilder/09.webp","reference":"Lukas 1,46–55","verses":[{"number":46,"text":"Und Maria sprach: Meine Seele erhebt den HERRN,"},{"number":47,"text":"und mein Geist freuet sich Gottes, meines Heilands;"},{"number":48,"text":"denn er hat die Niedrigkeit seiner Magd angesehen. Siehe, von nun an werden mich selig preisen alle Kindeskinder;"},{"number":49,"text":"denn er hat große Dinge an mir getan, der da mächtig ist und des Name heilig ist."},{"number":50,"text":"Und seine Barmherzigkeit währet immer für und für bei denen, die ihn fürchten."},{"number":51,"text":"Er übet Gewalt mit seinem Arm und zerstreut, die hoffärtig sind in ihres Herzens Sinn."},{"number":52,"text":"Er stößt die Gewaltigen vom Stuhl und erhebt die Niedrigen."},{"number":53,"text":"Die Hungrigen füllt er mit Gütern und läßt die Reichen leer."},{"number":54,"text":"Er denkt der Barmherzigkeit und hilft seinem Diener Israel wieder auf,"},{"number":55,"text":"wie er geredet hat unsern Vätern, Abraham und seinem Samen ewiglich."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":10,"title":"Der Abschied von Elisabeth","image":"bilder/10.webp","reference":"Lukas 1,56","verses":[{"number":56,"text":"Und Maria blieb bei ihr bei drei Monaten; darnach kehrte sie wiederum heim."}],"source":"https://ebible.org/deu1912/LUK01.htm","editorial":false},{"day":11,"title":"Josefs Gedanken","image":"bilder/11.webp","reference":"Matthäus 1,18–19","verses":[{"number":18,"text":"Die Geburt Christi war aber also getan. Als Maria, seine Mutter, dem Joseph vertraut war, fand sich's ehe er sie heimholte, daß sie schwanger war von dem heiligen Geist."},{"number":19,"text":"Joseph aber, ihr Mann, war fromm und wollte sie nicht in Schande bringen, gedachte aber, sie heimlich zu verlassen."}],"source":"https://ebible.org/deu1912/MAT01.htm","editorial":false},{"day":12,"title":"Der Engel spricht zu Josef","image":"bilder/12.webp","reference":"Matthäus 1,20–21","verses":[{"number":20,"text":"Indem er aber also gedachte, siehe, da erschien ihm ein Engel des HERRN im Traum und sprach: Joseph, du Sohn Davids, fürchte dich nicht, Maria, dein Gemahl, zu dir zu nehmen; denn das in ihr geboren ist, das ist von dem heiligen Geist."},{"number":21,"text":"Und sie wird einen Sohn gebären, des Namen sollst du Jesus heißen; denn er wird sein Volk selig machen von ihren Sünden."}],"source":"https://ebible.org/deu1912/MAT01.htm","editorial":false},{"day":13,"title":"Die Verheißung an Josef","image":"bilder/13.webp","reference":"Matthäus 1,21–23","verses":[{"number":21,"text":"Und sie wird einen Sohn gebären, des Namen sollst du Jesus heißen; denn er wird sein Volk selig machen von ihren Sünden."},{"number":22,"text":"Das ist aber alles geschehen, auf daß erfüllt würde, was der HERR durch den Propheten gesagt hat, der da spricht:"},{"number":23,"text":"“Siehe, eine Jungfrau wird schwanger sein und einen Sohn gebären, und sie werden seinen Namen Immanuel heißen”, das ist verdolmetscht: Gott mit uns."}],"source":"https://ebible.org/deu1912/MAT01.htm","editorial":false},{"day":14,"title":"Josefs Entscheidung","image":"bilder/14.webp","reference":"Matthäus 1,24–25","verses":[{"number":24,"text":"Da nun Joseph vom Schlaf erwachte, tat er, wie ihm des HERRN Engel befohlen hatte, und nahm sein Gemahl zu sich."},{"number":25,"text":"Und er erkannte sie nicht, bis sie ihren ersten Sohn gebar; und hieß seinen Namen Jesus."}],"source":"https://ebible.org/deu1912/MAT01.htm","editorial":false},{"day":15,"title":"Die Volkszählung","image":"bilder/15.webp","reference":"Lukas 2,1–3","verses":[{"number":1,"text":"Es begab sich aber zu der Zeit, daß ein Gebot von dem Kaiser Augustus ausging, daß alle Welt geschätzt würde."},{"number":2,"text":"Und diese Schätzung war die allererste und geschah zu der Zeit, da Cyrenius Landpfleger von Syrien war."},{"number":3,"text":"Und jedermann ging, daß er sich schätzen ließe, ein jeglicher in seine Stadt."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":false},{"day":16,"title":"Der Weg nach Bethlehem","image":"bilder/16.webp","reference":"Lukas 2,4","verses":[{"number":4,"text":"Da machte sich auch auf Joseph aus Galiläa, aus der Stadt Nazareth, in das jüdische Land zur Stadt Davids, die da heißt Bethlehem, darum daß er von dem Hause und Geschlechte Davids war,"}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":false},{"day":17,"title":"Die Ankunft in Bethlehem","image":"bilder/17.webp","reference":"Lukas 2,5–7","verses":[{"number":5,"text":"auf daß er sich schätzen ließe mit Maria, seinem vertrauten Weibe, die ward schwanger."},{"number":6,"text":"Und als sie daselbst waren, kam die Zeit, da sie gebären sollte."},{"number":7,"text":"Und sie gebar ihren ersten Sohn und wickelte ihn in Windeln und legte ihn in eine Krippe; denn sie hatten sonst keinen Raum in der Herberge."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":false},{"day":18,"title":"Die Geburt","image":"bilder/18.webp","reference":"Lukas 2,6–7","verses":[{"number":6,"text":"Und als sie daselbst waren, kam die Zeit, da sie gebären sollte."},{"number":7,"text":"Und sie gebar ihren ersten Sohn und wickelte ihn in Windeln und legte ihn in eine Krippe; denn sie hatten sonst keinen Raum in der Herberge."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":false},{"day":19,"title":"Die Hirten auf dem Feld","image":"bilder/19.webp","reference":"Lukas 2,8–12","verses":[{"number":8,"text":"Und es waren Hirten in derselben Gegend auf dem Felde bei den Hürden, die hüteten des Nachts ihre Herde."},{"number":9,"text":"Und siehe, des HERRN Engel trat zu ihnen, und die Klarheit des HERRN leuchtete um sie; und sie fürchteten sich sehr."},{"number":10,"text":"Und der Engel sprach zu ihnen: Fürchtet euch nicht! siehe, ich verkündige euch große Freude, die allem Volk widerfahren wird;"},{"number":11,"text":"denn euch ist heute der Heiland geboren, welcher ist Christus, der HERR, in der Stadt Davids."},{"number":12,"text":"Und das habt zum Zeichen: ihr werdet finden das Kind in Windeln gewickelt und in einer Krippe liegen."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":false},{"day":20,"title":"Der Engelschor","image":"bilder/20.webp","reference":"Lukas 2,13–14","verses":[{"number":13,"text":"Und alsbald war da bei dem Engel die Menge der himmlischen Heerscharen, die lobten Gott und sprachen:"},{"number":14,"text":"Ehre sei Gott in der Höhe und Frieden auf Erden und den Menschen ein Wohlgefallen."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":false},{"day":21,"title":"Die leere Krippe","image":"bilder/21.webp","reference":"Lukas 2,5","verses":[{"number":5,"text":"auf daß er sich schätzen ließe mit Maria, seinem vertrauten Weibe, die ward schwanger."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":true},{"day":22,"title":"Die stille Erwartung","image":"bilder/22.webp","reference":"Lukas 2,6","verses":[{"number":6,"text":"Und als sie daselbst waren, kam die Zeit, da sie gebären sollte."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":true},{"day":23,"title":"Maria und Josef","image":"bilder/23.webp","reference":"Lukas 2,6–7","verses":[{"number":6,"text":"Und als sie daselbst waren, kam die Zeit, da sie gebären sollte."},{"number":7,"text":"Und sie gebar ihren ersten Sohn und wickelte ihn in Windeln und legte ihn in eine Krippe; denn sie hatten sonst keinen Raum in der Herberge."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":true},{"day":24,"title":"Die Heilige Nacht","image":"bilder/24.webp","reference":"Lukas 2,7","verses":[{"number":7,"text":"Und sie gebar ihren ersten Sohn und wickelte ihn in Windeln und legte ihn in eine Krippe; denn sie hatten sonst keinen Raum in der Herberge."}],"source":"https://ebible.org/deu1912/LUK02.htm","editorial":true}];
const YEAR=2026;
const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Vienna',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
const local=Object.fromEntries(parts.map(p=>[p.type,Number(p.value)]));
const openThrough=local.year>YEAR?24:local.year===YEAR&&local.month===12?Math.min(local.day,24):0;
const calendar=document.getElementById('calendar'),dialog=document.getElementById('artDialog');
const artImage=document.getElementById('artImage'),title=document.getElementById('artTitle'),credit=document.getElementById('credit'),scripture=document.getElementById('scripture'),scriptureText=document.getElementById('scriptureText');
for(const item of entries){
 const open=item.day<=openThrough;const b=document.createElement('button');b.className='door';b.disabled=!open;
 b.setAttribute('aria-label',open?`Türchen ${item.day}: ${item.title}`:`Türchen ${item.day}, noch geschlossen`);
 if(open){const img=document.createElement('img');img.src=item.image;img.alt='';img.loading='lazy';b.append(img);
 b.addEventListener('click',()=>{
  artImage.src=item.image;artImage.alt=`${item.title}, ${item.reference}`;title.textContent=`${item.day}. Dezember · ${item.title}`;
  credit.textContent=item.reference+(item.editorial?' · Bibelstelle redaktionell zugeordnet':'');
  scripture.open=false;scriptureText.replaceChildren();
  for(const v of item.verses){const p=document.createElement('p');const num=document.createElement('sup');num.textContent=v.number+' ';p.append(num,document.createTextNode(v.text));scriptureText.append(p)}
  document.getElementById('sourceLink').href=item.source;
  dialog.showModal();
 });}
 const n=document.createElement('span');n.className='number';n.textContent=item.day;b.append(n);
 if(!open){const lock=document.createElement('span');lock.className='lock';lock.textContent='✦';b.append(lock)}calendar.append(b);
}
document.getElementById('closeDialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script></body></html>
