<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LESESPUREN – Adventkalender 2026</title>
<style>
:root{--night:#142a3e;--gold:#d7b474;--cream:#f8f1e5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#294761,var(--night) 75%);color:var(--cream);font-family:Georgia,serif;min-height:100vh}header{background:var(--cream);color:var(--night);padding:18px max(24px,calc((100vw - 1120px)/2));font-size:1.65rem;font-weight:bold}main{max-width:1120px;margin:auto;padding:42px 20px 70px;text-align:center}h1{font-size:clamp(2rem,5vw,3.7rem);font-weight:normal;margin:0 0 10px}p.intro{font-size:clamp(1rem,2vw,1.35rem);margin:0 0 35px}.calendar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px}.door{aspect-ratio:4/3;border:2px solid var(--gold);border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(145deg,#36546a,#1b3043);color:var(--cream);font:normal 2.6rem Georgia,serif;display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s}.door:not(:disabled){cursor:pointer}.door:not(:disabled):hover,.door:not(:disabled):focus-visible{transform:translateY(-3px);box-shadow:0 0 0 3px #fff4}.door:disabled{opacity:.72;cursor:not-allowed}.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.door .number{position:relative;z-index:1;text-shadow:0 2px 10px #000;background:#10223366;padding:0 9px;border-radius:6px}.door .lock{position:absolute;right:9px;top:8px;font:15px system-ui;opacity:.85}.note{margin-top:26px;color:#eadcc7;font:0.9rem system-ui,sans-serif}dialog{width:min(560px,calc(100% - 24px));border:1px solid var(--gold);border-radius:12px;background:var(--cream);color:var(--night);padding:20px;text-align:left}dialog::backdrop{background:#06131cbb}dialog img{width:100%;max-height:350px;object-fit:contain;background:#ddd}dialog h2{font-size:1.5rem}dialog a{display:inline-block;background:var(--night);color:white;padding:12px 17px;border-radius:6px;text-decoration:none}dialog .close{float:right;border:0;background:transparent;font-size:1.7rem;cursor:pointer}#credit{font-size:.82rem;color:#4d5660}@media(max-width:850px){.calendar{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.calendar{grid-template-columns:repeat(3,1fr);gap:8px}.door{font-size:2rem}}
</style>
</head>
<body><header>lesespuren.at</header><main><h1>Der LESESPUREN-Adventkalender</h1><p class="intro">24 kunsthistorische Entdeckungen auf dem Weg nach Weihnachten.</p><div class="calendar" id="calendar" aria-label="Adventkalender mit 24 Türchen"></div><p class="note">Jeden Tag öffnet sich ein neues Bild und seine Geschichte.</p></main>
<dialog id="artDialog" aria-labelledby="artTitle"><button class="close" id="closeDialog" aria-label="Schließen">×</button><img id="artImage" alt=""><h2 id="artTitle"></h2><p id="credit"></p><p><a id="articleLink" href="#">Zum Blogartikel lesen →</a></p></dialog>
<script>
// HIER DIE 24 EINTRÄGE PFLEGEN: Bildpfad, Titel, Urheber-/Lizenzangabe und Blog-Link.
// Beispiel: {day:1,title:'Verkündigung',image:'/bilder/advent/01.jpg',credit:'Künstler, Werk, Museum, Lizenz',url:'/blog/verkuendigung.html'}
const entries = Array.from({length:24},(_,i)=>({day:i+1,title:`Kunstwerk zum ${i+1}. Dezember`,image:`/bilder/advent/${String(i+1).padStart(2,'0')}.jpg`,credit:'Bildnachweis hier ergänzen',url:`/blog/advent-${String(i+1).padStart(2,'0')}.html`}));
const YEAR=2026;
// Tagesfreigabe in österreichischer Zeitzone (Europe/Vienna).
const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Vienna',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
const local=Object.fromEntries(parts.map(p=>[p.type,Number(p.value)]));
const unlocked=local.year>YEAR||(local.year===YEAR&&local.month===12)?24:(local.year===YEAR&&local.month===12?local.day:0);
// Korrekte Tageszahl im Dezember (nach dem 24. bleiben alle offen).
const openThrough=local.year>YEAR?24:local.year===YEAR&&local.month===12?Math.min(local.day,24):0;
const calendar=document.getElementById('calendar'),dialog=document.getElementById('artDialog');
for(const item of entries){const open=item.day<=openThrough;const b=document.createElement('button');b.className='door';b.disabled=!open;b.setAttribute('aria-label',open?`Türchen ${item.day}: ${item.title}`:`Türchen ${item.day}, noch geschlossen`);if(open){const img=document.createElement('img');img.src=item.image;img.alt='';img.loading='lazy';img.onerror=()=>img.remove();b.append(img);b.addEventListener('click',()=>{document.getElementById('artImage').src=item.image;document.getElementById('artImage').alt=item.title;document.getElementById('artTitle').textContent=item.title;document.getElementById('credit').textContent=item.credit;document.getElementById('articleLink').href=item.url;dialog.showModal()})}const n=document.createElement('span');n.className='number';n.textContent=item.day;b.append(n);if(!open){const lock=document.createElement('span');lock.className='lock';lock.textContent='✦';b.append(lock)}calendar.append(b)}
document.getElementById('closeDialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script></body></html>
